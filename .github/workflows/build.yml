name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unzip newest project zip
        run: |
          BEST=""; BT=0
          while IFS= read -r f; do
            t=$(git log -1 --format=%ct -- "$f")
            if [ "${t:-0}" -ge "$BT" ]; then BT=${t:-0}; BEST="$f"; fi
          done < <(git ls-files '*.zip')
          echo "Using zip: $BEST"
          [ -n "$BEST" ] || { echo "No zip file found in repo"; exit 1; }
          rm -rf _proj && mkdir _proj
          unzip -q -o "$BEST" -d _proj
          DIR=$(dirname "$(find _proj -name settings.gradle | head -1)")
          echo "Project dir: $DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
